# One agent per node. Reads the host's /proc and /sys read-only; never writes to the host.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fleetcheck
  labels: {app.kubernetes.io/name: fleetcheck}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: fleetcheck}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 10%}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fleetcheck}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9105"
    spec:
      tolerations:
        - operator: Exists          # also run on tainted (drained or control-plane) nodes
      containers:
        - name: agent
          image: fleetcheck
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/fleetcheck/config.yml", "--root", "/host"]
          env:
            - name: FLEETCHECK_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: metrics, containerPort: 9105}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /status, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/fleetcheck, readOnly: true}
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
      volumes:
        - name: config
          configMap: {name: fleetcheck-config}
        - name: proc
          hostPath: {path: /proc}
        - name: sys
          hostPath: {path: /sys}
